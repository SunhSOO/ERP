project: Luminode ERP Platform
version: '1.0'
approved_design_date: '2026-08-05'
phase_gate_policy: strict
default_concurrency:
  implementation_agents: 3
  review_agents: 2
  integration_agents: 1
branch_pattern: feature/{work_package_id}-{slug}
states:
- proposed
- ready
- contract_review
- in_progress
- self_tested
- domain_review
- qa_security_review
- integration
- done
- blocked
shared_file_owners:
  python_node_lockfiles: integration
  alembic_head: data_migration
  openapi_generated_client: integration
  ui_tokens: frontend_ux
  compose_networks_volumes: devops
  permission_catalog: iam
  event_envelope: platform
phases:
- phase: 0
  name: 기반 플랫폼
  entry_gate: 승인된 설계 기준선
  exit_gate: 인증·권한·감사·파일·알림·백업·복구가 통합 검증되고 Critical/High 결함이 없다.
  waves:
  - id: '0.1'
    packages:
    - id: WP-PLT-001
      title: 저장소·모듈 경계 부트스트랩
      primary_role: Platform Backend Agent
      stream: platform
      dependencies: []
      owned_modules:
      - core
      risk: high
      required_reviews:
      - architecture
      - qa_security
      branch: feature/WP-PLT-001-repository-bootstrap
      acceptance_criteria:
      - 모든 모듈이 표준 구조를 사용한다
      - CI에서 금지된 cross-module import를 탐지한다
      - 개발 환경이 문서대로 재현된다
  - id: '0.2'
    packages:
    - id: WP-OPS-001
      title: Docker Compose 개발·스테이징 기반
      primary_role: DevOps Agent
      stream: infra
      dependencies:
      - WP-PLT-001
      owned_modules:
      - operations
      risk: high
      required_reviews:
      - architecture
      - qa_security
      branch: feature/WP-OPS-001-compose-foundation
      acceptance_criteria:
      - PostgreSQL/Redis/MinIO와 앱이 health 상태로 기동한다
      - 데이터 서비스 포트가 불필요하게 외부 노출되지 않는다
      - 이미지 버전이 고정된다
  - id: '0.3'
    packages:
    - id: WP-PLT-002
      title: 인증·세션·MFA 기반
      primary_role: Platform Backend Agent
      stream: platform
      dependencies:
      - WP-PLT-001
      - WP-OPS-001
      owned_modules:
      - iam
      risk: critical
      required_reviews:
      - architecture
      - qa_security
      branch: feature/WP-PLT-002-auth-session-mfa
      acceptance_criteria:
      - 로그인/로그아웃/세션 철회가 동작한다
      - 잠금·속도 제한이 적용된다
      - 비활성 사용자 세션이 즉시 철회된다
  - id: '0.4'
    packages:
    - id: WP-PLT-003
      title: 회사·부서·직원·사용자 관리
      primary_role: Platform Backend Agent
      stream: platform
      dependencies:
      - WP-PLT-002
      owned_modules:
      - iam
      - hr-core
      risk: high
      required_reviews:
      - architecture
      - qa_security
      branch: feature/WP-PLT-003-organization-users
      acceptance_criteria:
      - 부서 계층과 직원 소속을 관리한다
      - 사용자와 직원 연결/분리가 가능하다
      - 퇴사 이력을 삭제하지 않는다
    - id: WP-UI-001
      title: 디자인 시스템·전역 레이아웃
      primary_role: Frontend/UX Agent
      stream: ux
      dependencies:
      - WP-PLT-001
      - WP-PLT-002
      owned_modules:
      - frontend-core
      risk: medium
      required_reviews:
      - domain_owner
      - qa
      branch: feature/WP-UI-001-design-system-shell
      acceptance_criteria:
      - loading/empty/error/forbidden/stale 패턴이 제공된다
      - 키보드와 반응형 기본 검증을 통과한다
      - 권한 기반 메뉴가 동작한다
  - id: '0.5'
    packages:
    - id: WP-PLT-004
      title: RBAC·범위 권한 엔진
      primary_role: Platform Backend Agent
      stream: platform
      dependencies:
      - WP-PLT-002
      - WP-PLT-003
      owned_modules:
      - iam
      risk: critical
      required_reviews:
      - architecture
      - qa_security
      branch: feature/WP-PLT-004-rbac-scope-engine
      acceptance_criteria:
      - object-level 권한이 API마다 적용된다
      - 외부 사용자는 초대 프로젝트만 접근한다
      - 권한 변경이 감사된다
  - id: '0.6'
    packages:
    - id: WP-PLT-005
      title: 감사 로그·활동 로그·Outbox
      primary_role: Platform Backend Agent
      stream: platform
      dependencies:
      - WP-PLT-004
      owned_modules:
      - core
      - collab
      risk: critical
      required_reviews:
      - architecture
      - qa_security
      branch: feature/WP-PLT-005-audit-outbox
      acceptance_criteria:
      - 중요 command가 actor/before/after/trace를 남긴다
      - outbox 중복 소비가 방지된다
      - 일반 앱 권한으로 감사 로그를 수정하지 못한다
  - id: '0.7'
    packages:
    - id: WP-PLT-006
      title: 파일 업로드·검사·MinIO 기반
      primary_role: Platform Backend Agent
      stream: platform
      dependencies:
      - WP-OPS-001
      - WP-PLT-004
      - WP-PLT-005
      owned_modules:
      - dms-core
      risk: critical
      required_reviews:
      - architecture
      - qa_security
      branch: feature/WP-PLT-006-secure-file-storage
      acceptance_criteria:
      - 업로드→검사→READY 상태가 동작한다
      - 권한 없는 다운로드가 차단된다
      - 체크섬과 파일 크기가 검증된다
    - id: WP-PLT-007
      title: 댓글·멘션·알림 기반
      primary_role: Platform Backend Agent
      stream: platform
      dependencies:
      - WP-PLT-004
      - WP-PLT-005
      owned_modules:
      - collab
      risk: high
      required_reviews:
      - architecture
      - qa_security
      branch: feature/WP-PLT-007-collaboration-notifications
      acceptance_criteria:
      - 댓글/답글/멘션이 권한 범위를 따른다
      - 알림 중복 억제와 읽음 상태가 동작한다
      - 이메일 실패가 인앱 알림을 막지 않는다
  - id: '0.8'
    packages:
    - id: WP-OPS-002
      title: 관측성·백업 최소구성
      primary_role: DevOps Agent
      stream: infra
      dependencies:
      - WP-OPS-001
      - WP-PLT-005
      - WP-PLT-006
      owned_modules:
      - operations
      risk: critical
      required_reviews:
      - architecture
      - qa_security
      branch: feature/WP-OPS-002-observability-backup
      acceptance_criteria:
      - 핵심 서비스 상태가 보인다
      - 백업 실패 경보가 발생한다
      - 샘플 복원과 파일 체크섬 검증이 완료된다
  - id: '0.9'
    packages:
    - id: WP-QA-000
      title: Phase 0 보안·복구 게이트
      primary_role: QA·Security Agent
      stream: qa
      dependencies:
      - WP-PLT-002
      - WP-PLT-003
      - WP-PLT-004
      - WP-PLT-005
      - WP-PLT-006
      - WP-PLT-007
      - WP-UI-001
      - WP-OPS-002
      owned_modules:
      - qa
      risk: critical
      required_reviews:
      - architecture
      - qa_security
      branch: test/WP-QA-000-foundation-gate
      acceptance_criteria:
      - IDOR/세션/악성 업로드 테스트를 통과한다
      - 신규 환경 복원이 가능하다
      - Critical/High 결함이 없다
- phase: 1
  name: 프로젝트 운영 코어
  entry_gate: Phase 0 QA 게이트 통과
  exit_gate: 프로젝트 파일럿 사용자가 프로젝트·업무·회의·문서·산출물·일반결재를 한 흐름으로 수행한다.
  waves:
  - id: '1.1'
    packages:
    - id: WP-APR-001
      title: 일반 전자결재
      primary_role: Operations Domain Agent
      stream: operations
      dependencies:
      - WP-PLT-003
      - WP-PLT-004
      - WP-PLT-005
      - WP-PLT-007
      owned_modules:
      - workflow
      risk: critical
      required_reviews:
      - architecture
      - qa_security
      branch: feature/wp-apr-001
      acceptance_criteria:
      - 승인 단계와 대결을 추적한다
      - 자기승인 제한이 가능하다
      - 완료 스냅샷과 감사가 남는다
    - id: WP-PRJ-001
      title: 프로젝트·멤버·상태
      primary_role: Project Domain Agent
      stream: project
      dependencies:
      - WP-QA-000
      owned_modules:
      - project
      risk: high
      required_reviews:
      - architecture
      - qa_security
      branch: feature/wp-prj-001
      acceptance_criteria:
      - 프로젝트 코드가 중복되지 않는다
      - 프로젝트 범위 권한이 적용된다
      - 상태 전이가 감사된다
  - id: '1.2'
    packages:
    - id: WP-CAL-001
      title: 캘린더·회의·회의록 수동 기능
      primary_role: Project Domain Agent
      stream: project
      dependencies:
      - WP-PRJ-001
      - WP-PLT-007
      owned_modules:
      - calendar
      - meeting
      risk: medium
      required_reviews:
      - domain_owner
      - qa
      branch: feature/wp-cal-001
      acceptance_criteria:
      - 회의와 프로젝트가 연결된다
      - 참석/안건/결정/액션을 기록한다
      - 액션을 수동 업무로 전환한다
    - id: WP-DMS-001
      title: 문서·폴더·불변 버전
      primary_role: DMS Agent
      stream: document
      dependencies:
      - WP-PLT-006
      - WP-PRJ-001
      owned_modules:
      - dms
      risk: critical
      required_reviews:
      - architecture
      - qa_security
      branch: feature/wp-dms-001
      acceptance_criteria:
      - 문서 버전은 수정되지 않는다
      - 최신/승인/제출 버전 포인터가 분리된다
      - 프로젝트 권한이 폴더/문서에 상속된다
    - id: WP-PRJ-002
      title: 프로젝트 템플릿·마일스톤
      primary_role: Project Domain Agent
      stream: project
      dependencies:
      - WP-PRJ-001
      owned_modules:
      - project
      risk: high
      required_reviews:
      - architecture
      - qa_security
      branch: feature/wp-prj-002
      acceptance_criteria:
      - 템플릿 버전이 불변이다
      - 적용 전 생성 항목을 미리 본다
      - 실패한 하위 작업을 재시도할 수 있다
    - id: WP-PRJ-003
      title: 업무·하위업무·의존성
      primary_role: Project Domain Agent
      stream: project
      dependencies:
      - WP-PRJ-001
      - WP-UI-001
      owned_modules:
      - project
      risk: high
      required_reviews:
      - architecture
      - qa_security
      branch: feature/wp-prj-003
      acceptance_criteria:
      - 순환 의존성을 차단한다
      - 동시 수정 충돌을 처리한다
      - 다른 프로젝트 업무 접근을 차단한다
    - id: WP-PRJ-004
      title: 리스크·이슈·의사결정
      primary_role: Project Domain Agent
      stream: project
      dependencies:
      - WP-PRJ-001
      - WP-PLT-007
      owned_modules:
      - project
      risk: medium
      required_reviews:
      - domain_owner
      - qa
      branch: feature/wp-prj-004
      acceptance_criteria:
      - 리스크와 이슈 상태가 구분된다
      - 결정 대체 관계를 보존한다
      - 고위험 리스크 알림이 동작한다
  - id: '1.3'
    packages:
    - id: WP-DMS-002
      title: 산출물·검토·제출
      primary_role: DMS Agent
      stream: document
      dependencies:
      - WP-DMS-001
      - WP-PRJ-002
      owned_modules:
      - dms
      - project
      risk: critical
      required_reviews:
      - architecture
      - qa_security
      branch: feature/wp-dms-002
      acceptance_criteria:
      - 필수 산출물 상태를 추적한다
      - 승인/제출본을 잠근다
      - 면제에는 결재 근거가 필요하다
  - id: '1.4'
    packages:
    - id: WP-UI-PRJ-001
      title: 프로젝트 통합 홈·받은 작업함
      primary_role: Frontend/UX Agent
      stream: ux
      dependencies:
      - WP-PRJ-002
      - WP-PRJ-003
      - WP-PRJ-004
      - WP-CAL-001
      - WP-DMS-002
      - WP-APR-001
      owned_modules:
      - frontend-project
      risk: medium
      required_reviews:
      - domain_owner
      - qa
      branch: feature/wp-ui-prj-001
      acceptance_criteria:
      - 경고에서 원본으로 드릴다운한다
      - PM과 직원 역할별로 필요한 정보가 보인다
      - 부분 실패가 전체 화면을 막지 않는다
  - id: '1.5'
    packages:
    - id: WP-QA-P1
      title: Phase 1 프로젝트 파일럿 게이트
      primary_role: QA·Security Agent
      stream: qa
      dependencies:
      - WP-UI-PRJ-001
      owned_modules:
      - qa
      risk: critical
      required_reviews:
      - architecture
      - qa_security
      branch: feature/wp-qa-p1
      acceptance_criteria:
      - 템플릿→업무→회의→산출물→결재 흐름이 통과한다
      - 외부 사용자의 범위 격리가 확인된다
      - 파일럿 사용자 승인 기록이 있다
- phase: 2
  name: CRM·영업·견적·계약
  entry_gate: Phase 1 QA 게이트 통과
  exit_gate: 고객 등록부터 수주·계약·프로젝트 전환까지 E2E가 통과하고 계약 원본과 버전 이력이 보존된다.
  waves:
  - id: '2.1'
    packages:
    - id: WP-CRM-001
      title: 고객사·담당자
      primary_role: Commercial Domain Agent
      stream: commercial
      dependencies:
      - WP-QA-000
      owned_modules:
      - crm
      risk: high
      required_reviews:
      - architecture
      - qa_security
      branch: feature/wp-crm-001
      acceptance_criteria:
      - 사업자번호/도메인 중복 경고가 동작한다
      - 고객 접근 권한과 민감 메모가 분리된다
      - 프로젝트/계약 링크가 제공된다
  - id: '2.2'
    packages:
    - id: WP-CRM-002
      title: 리드·영업활동
      primary_role: Commercial Domain Agent
      stream: commercial
      dependencies:
      - WP-CRM-001
      - WP-CAL-001
      owned_modules:
      - crm
      risk: medium
      required_reviews:
      - domain_owner
      - qa
      branch: feature/wp-crm-002
      acceptance_criteria:
      - 전환 결과가 고객/담당자/기회와 연결된다
      - 중복 전환을 방지한다
      - 후속 활동이 일정/알림과 연결된다
    - id: WP-SAL-001
      title: 영업기회·파이프라인
      primary_role: Commercial Domain Agent
      stream: commercial
      dependencies:
      - WP-CRM-001
      owned_modules:
      - sales
      risk: high
      required_reviews:
      - architecture
      - qa_security
      branch: feature/wp-sal-001
      acceptance_criteria:
      - 단계 변경 이력이 남는다
      - 수주 조건을 검증한다
      - 가중 파이프라인 근거를 추적한다
  - id: '2.3'
    packages:
    - id: WP-SAL-002
      title: 품목 카탈로그·견적 버전
      primary_role: Commercial Domain Agent
      stream: commercial
      dependencies:
      - WP-SAL-001
      - WP-APR-001
      - WP-DMS-001
      owned_modules:
      - sales
      risk: critical
      required_reviews:
      - architecture
      - qa_security
      branch: feature/wp-sal-002
      acceptance_criteria:
      - 공급가/세액/합계 계산이 정확하다
      - 발송 견적은 새 버전으로만 수정한다
      - 원가/마진 권한이 분리된다
  - id: '2.4'
    packages:
    - id: WP-CON-001
      title: 계약·버전·보안등급
      primary_role: Commercial Domain Agent
      stream: commercial
      dependencies:
      - WP-CRM-001
      - WP-SAL-002
      - WP-APR-001
      - WP-DMS-001
      owned_modules:
      - contract
      risk: critical
      required_reviews:
      - architecture
      - qa_security
      branch: feature/wp-con-001
      acceptance_criteria:
      - ACTIVE 조건이 검증된다
      - 계약 변경 이력이 보존된다
      - 민감 문서 접근과 다운로드가 감사된다
  - id: '2.5'
    packages:
    - id: WP-AUT-001
      title: 수주·계약→프로젝트 전환
      primary_role: Commercial Domain Agent
      stream: commercial
      dependencies:
      - WP-SAL-001
      - WP-CON-001
      - WP-PRJ-002
      owned_modules:
      - sales
      - contract
      - project
      risk: critical
      required_reviews:
      - architecture
      - qa_security
      branch: feature/wp-aut-001
      acceptance_criteria:
      - 고객/계약/PM/기간을 미리 보여준다
      - 부분 실패를 재시도한다
      - 동일 계약 프로젝트 중복을 방지한다
    - id: WP-CON-002
      title: 계약 의무·지급 일정·갱신
      primary_role: Commercial Domain Agent
      stream: commercial
      dependencies:
      - WP-CON-001
      - WP-DMS-002
      owned_modules:
      - contract
      risk: high
      required_reviews:
      - architecture
      - qa_security
      branch: feature/wp-con-002
      acceptance_criteria:
      - 의무와 프로젝트 산출물을 연결한다
      - 갱신 90/60/30/7일 알림이 중복 없이 생성된다
      - 지급계획과 실제 매출을 구분한다
  - id: '2.6'
    packages:
    - id: WP-UI-COM-001
      title: 영업·계약 통합 UX
      primary_role: Frontend/UX Agent
      stream: ux
      dependencies:
      - WP-CRM-002
      - WP-SAL-002
      - WP-CON-002
      - WP-AUT-001
      owned_modules:
      - frontend-commercial
      risk: medium
      required_reviews:
      - domain_owner
      - qa
      branch: feature/wp-ui-com-001
      acceptance_criteria:
      - 금액 변경 전후 비교가 보인다
      - 갱신/수주에서 다음 행동이 명확하다
      - 모바일은 조회/간단 활동이 가능하다
  - id: '2.7'
    packages:
    - id: WP-QA-P2
      title: Phase 2 수주 여정 게이트
      primary_role: QA·Security Agent
      stream: qa
      dependencies:
