[project]
name = "luminode-erp"
version = "0.1.0"
description = "Luminode ERP Platform foundation"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi==0.116.1",
  # 실제 깃허브 어댑터가 REST API를 호출한다. WP-PKD-031.
  "httpx==0.28.1",
  "uvicorn[standard]==0.35.0",
]

[dependency-groups]
dev = [
  "mypy==1.17.1",
  "pytest==9.0.2",
  "ruff==0.12.9",
]

[tool.pytest.ini_options]
pythonpath = [".", "apps/backend/src"]
testpaths = ["apps/backend/tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["apps/backend/src", "apps/backend/tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["apps/backend/src", "apps/backend/tests", "scripts"]
exclude = "(^|/)tests/architecture/fixtures/"

[tool.uv]
default-groups = ["dev"]
