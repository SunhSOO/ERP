project: Luminode ERP Platform
baseline:
  users_now: <=10
  users_max: <=30
  deployment: self-hosted
  locale: ko-KR
  timezone: Asia/Seoul
  architecture: modular-monolith-with-workers
workflow_states:
- proposed
- ready
- in_progress
- review
- blocked
- done
priority_rule: Phase dependency first; packages without unmet dependencies may run in parallel.
packages:
- id: WP-PLT-001
  phase: 0
  stream: platform
  title: 저장소·모듈 경계 부트스트랩
  goal: 백엔드/프론트/인프라의 공통 구조와 모듈 경계 검사 기반을 만든다.
  dependencies: []
  owned_modules:
  - core
  outputs:
  - repository structure
  - module boundary rules
  - developer commands
  acceptance_criteria:
  - 모든 모듈이 표준 구조를 사용한다
  - CI에서 금지된 cross-module import를 탐지한다
  - 개발 환경이 문서대로 재현된다
  risk: high
  required_reviews:
  - architecture
  - qa_security
- id: WP-OPS-001
  phase: 0
  stream: infra
  title: Docker Compose 개발·스테이징 기반
  goal: ERP 핵심 서비스의 재현 가능한 컨테이너 환경을 만든다.
  dependencies:
  - WP-PLT-001
  owned_modules:
  - operations
  outputs:
  - compose manifests
  - health checks
  - environment templates
  acceptance_criteria:
  - PostgreSQL/Redis/MinIO와 앱이 health 상태로 기동한다
  - 데이터 서비스 포트가 불필요하게 외부 노출되지 않는다
  - 이미지 버전이 고정된다
  risk: high
  required_reviews:
  - architecture
  - qa_security
- id: WP-PLT-002
  phase: 0
  stream: platform
  title: 인증·세션·MFA 기반
  goal: 사용자 로그인, 세션 철회, 비밀번호와 MFA 정책을 구현한다.
  dependencies:
  - WP-PLT-001
  - WP-OPS-001
  owned_modules:
  - iam
  outputs:
  - auth APIs
  - session store
  - security events
  acceptance_criteria:
  - 로그인/로그아웃/세션 철회가 동작한다
  - 잠금·속도 제한이 적용된다
  - 비활성 사용자 세션이 즉시 철회된다
  risk: critical
  required_reviews:
  - architecture
  - qa_security
- id: WP-PLT-003
  phase: 0
  stream: platform
  title: 회사·부서·직원·사용자 관리
  goal: 조직과 계정의 기준 엔터티 및 관리자 화면 계약을 만든다.
  dependencies:
  - WP-PLT-002
  owned_modules:
  - iam
  - hr-core
  outputs:
  - organization APIs
  - employee/user models
  - admin screens
  acceptance_criteria:
  - 부서 계층과 직원 소속을 관리한다
  - 사용자와 직원 연결/분리가 가능하다
  - 퇴사 이력을 삭제하지 않는다
  risk: high
  required_reviews:
  - architecture
  - qa_security
- id: WP-PLT-004
  phase: 0
  stream: platform
  title: RBAC·범위 권한 엔진
  goal: 기능 권한과 company/department/project/self 범위를 판정한다.
  dependencies:
  - WP-PLT-002
  - WP-PLT-003
  owned_modules:
  - iam
  outputs:
  - permission catalog
  - policy engine
  - permission simulator
  acceptance_criteria:
  - object-level 권한이 API마다 적용된다
  - 외부 사용자는 초대 프로젝트만 접근한다
  - 권한 변경이 감사된다
  risk: critical
  required_reviews:
  - architecture
  - qa_security
- id: WP-PLT-005
  phase: 0
  stream: platform
  title: 감사 로그·활동 로그·Outbox
  goal: 중요 변경 추적과 신뢰성 있는 이벤트 발행 기반을 만든다.
  dependencies:
  - WP-PLT-004
  owned_modules:
  - core
  - collab
  outputs:
  - audit log
  - activity timeline
  - outbox publisher
  acceptance_criteria:
  - 중요 command가 actor/before/after/trace를 남긴다
  - outbox 중복 소비가 방지된다
  - 일반 앱 권한으로 감사 로그를 수정하지 못한다
  risk: critical
  required_reviews:
  - architecture
  - qa_security
- id: WP-PLT-006
  phase: 0
  stream: platform
  title: 파일 업로드·검사·MinIO 기반
  goal: 안전한 분할 업로드와 file object 메타데이터를 구현한다.
  dependencies:
  - WP-OPS-001
  - WP-PLT-004
  - WP-PLT-005
  owned_modules:
  - dms-core
  outputs:
  - upload session APIs
  - malware scan flow
  - download authorization
  acceptance_criteria:
  - 업로드→검사→READY 상태가 동작한다
  - 권한 없는 다운로드가 차단된다
  - 체크섬과 파일 크기가 검증된다
  risk: critical
  required_reviews:
  - architecture
  - qa_security
- id: WP-PLT-007
  phase: 0
  stream: platform
  title: 댓글·멘션·알림 기반
  goal: 모든 엔터티에서 재사용할 협업 및 알림 서비스를 만든다.
  dependencies:
  - WP-PLT-004
  - WP-PLT-005
  owned_modules:
  - collab
  outputs:
  - comments APIs
  - notification inbox
  - delivery worker
  acceptance_criteria:
  - 댓글/답글/멘션이 권한 범위를 따른다
  - 알림 중복 억제와 읽음 상태가 동작한다
  - 이메일 실패가 인앱 알림을 막지 않는다
  risk: high
  required_reviews:
  - architecture
  - qa_security
- id: WP-UI-001
  phase: 0
  stream: ux
  title: 디자인 시스템·전역 레이아웃
  goal: 공통 컴포넌트, 내비게이션, 화면 상태 표준을 만든다.
  dependencies:
  - WP-PLT-001
  - WP-PLT-002
  owned_modules:
  - frontend-core
  outputs:
  - design tokens
  - app shell
  - shared components
  acceptance_criteria:
  - loading/empty/error/forbidden/stale 패턴이 제공된다
  - 키보드와 반응형 기본 검증을 통과한다
  - 권한 기반 메뉴가 동작한다
  risk: medium
  required_reviews:
  - domain_owner
  - qa
- id: WP-OPS-002
  phase: 0
  stream: infra
  title: 관측성·백업 최소구성
  goal: 로그·메트릭·경보와 PostgreSQL/MinIO 백업을 구성한다.
  dependencies:
  - WP-OPS-001
  - WP-PLT-005
  - WP-PLT-006
  owned_modules:
  - operations
  outputs:
  - Prometheus/Grafana/Loki
  - backup jobs
  - restore runbook
  acceptance_criteria:
  - 핵심 서비스 상태가 보인다
  - 백업 실패 경보가 발생한다
  - 샘플 복원과 파일 체크섬 검증이 완료된다
  risk: critical
  required_reviews:
  - architecture
  - qa_security
- id: WP-QA-000
  phase: 0
  stream: qa
  title: Phase 0 보안·복구 게이트
  goal: 기반 플랫폼의 인증, 권한, 파일, 감사, 복구를 검증한다.
  dependencies:
  - WP-PLT-002
  - WP-PLT-003
  - WP-PLT-004
  - WP-PLT-005
  - WP-PLT-006
  - WP-PLT-007
  - WP-UI-001
  - WP-OPS-002
  owned_modules:
  - qa
  outputs:
  - security regression suite
  - foundation E2E
  - restore evidence
  acceptance_criteria:
  - IDOR/세션/악성 업로드 테스트를 통과한다
  - 신규 환경 복원이 가능하다
  - Critical/High 결함이 없다
  risk: critical
  required_reviews:
  - architecture
  - qa_security
- id: WP-PRJ-001
  phase: 1
  stream: project
  title: 프로젝트·멤버·상태
  goal: 프로젝트 기본 정보, 참여자, 상태 머신을 구현한다.
  dependencies:
  - WP-QA-000
  owned_modules:
  - project
  outputs:
  - project APIs
  - project permissions
  - project screens
  acceptance_criteria:
  - 프로젝트 코드가 중복되지 않는다
  - 프로젝트 범위 권한이 적용된다
  - 상태 전이가 감사된다
  risk: high
  required_reviews:
  - architecture
  - qa_security
- id: WP-PRJ-002
  phase: 1
  stream: project
  title: 프로젝트 템플릿·마일스톤
  goal: 템플릿에서 마일스톤과 기본 구조를 생성한다.
  dependencies:
  - WP-PRJ-001
  owned_modules:
  - project
  outputs:
  - template versioning
  - milestone APIs
  - template preview
  acceptance_criteria:
  - 템플릿 버전이 불변이다
  - 적용 전 생성 항목을 미리 본다
  - 실패한 하위 작업을 재시도할 수 있다
  risk: high
  required_reviews:
  - architecture
  - qa_security
- id: WP-PRJ-003
  phase: 1
  stream: project
  title: 업무·하위업무·의존성
  goal: 업무 상태, 담당, 체크리스트, 의존성, 칸반을 구현한다.
  dependencies:
  - WP-PRJ-001
  - WP-UI-001
  owned_modules:
  - project
  outputs:
  - task APIs
  - kanban/list views
  - dependency validation
  acceptance_criteria:
  - 순환 의존성을 차단한다
  - 동시 수정 충돌을 처리한다
  - 다른 프로젝트 업무 접근을 차단한다
  risk: high
  required_reviews:
  - architecture
  - qa_security
- id: WP-PRJ-004
  phase: 1
  stream: project
  title: 리스크·이슈·의사결정
  goal: 프로젝트 위험과 문제, 결정 근거를 추적한다.
  dependencies:
  - WP-PRJ-001
  - WP-PLT-007
  owned_modules:
  - project
  outputs:
  - risk/issue/decision APIs
  - register screens
  - escalation events
  acceptance_criteria:
  - 리스크와 이슈 상태가 구분된다
  - 결정 대체 관계를 보존한다
  - 고위험 리스크 알림이 동작한다
  risk: medium
  required_reviews:
  - domain_owner
  - qa
- id: WP-CAL-001
  phase: 1
  stream: project
  title: 캘린더·회의·회의록 수동 기능
  goal: 개인/프로젝트 일정과 회의 안건, 결정, 액션을 관리한다.
  dependencies:
  - WP-PRJ-001
  - WP-PLT-007
  owned_modules:
  - calendar
  - meeting
  outputs:
  - calendar APIs
  - meeting screens
  - action item model
  acceptance_criteria:
  - 회의와 프로젝트가 연결된다
  - 참석/안건/결정/액션을 기록한다
  - 액션을 수동 업무로 전환한다
  risk: medium
  required_reviews:
  - domain_owner
  - qa
- id: WP-DMS-001
  phase: 1
  stream: document
  title: 문서·폴더·불변 버전
  goal: 논리 문서, 폴더, 버전, 미리보기 상태를 구현한다.
  dependencies:
  - WP-PLT-006
  - WP-PRJ-001
  owned_modules:
  - dms
  outputs:
  - document APIs
  - version workflow
  - document browser
  acceptance_criteria:
  - 문서 버전은 수정되지 않는다
  - 최신/승인/제출 버전 포인터가 분리된다
  - 프로젝트 권한이 폴더/문서에 상속된다
  risk: critical
  required_reviews:
  - architecture
  - qa_security
- id: WP-DMS-002
  phase: 1
  stream: document
  title: 산출물·검토·제출
  goal: 필수 산출물, 검토, 승인, 제출 이력을 구현한다.
  dependencies:
  - WP-DMS-001
  - WP-PRJ-002
  owned_modules:
  - dms
  - project
  outputs:
  - deliverable APIs
  - review flow
  - submission records
  acceptance_criteria:
  - 필수 산출물 상태를 추적한다
  - 승인/제출본을 잠근다
  - 면제에는 결재 근거가 필요하다
  risk: critical
  required_reviews:
  - architecture
  - qa_security
- id: WP-APR-001
  phase: 1
  stream: operations
  title: 일반 전자결재
  goal: 순차/병렬 결재, 반려, 회수, 재상신의 공통 엔진을 구현한다.
  dependencies:
  - WP-PLT-003
  - WP-PLT-004
  - WP-PLT-005
  - WP-PLT-007
  owned_modules:
  - workflow
  outputs:
  - approval engine
  - approval inbox
  - template baseline
  acceptance_criteria:
  - 승인 단계와 대결을 추적한다
  - 자기승인 제한이 가능하다
  - 완료 스냅샷과 감사가 남는다
  risk: critical
  required_reviews:
  - architecture
  - qa_security
- id: WP-UI-PRJ-001
  phase: 1
  stream: ux
  title: 프로젝트 통합 홈·받은 작업함
  goal: 프로젝트 개요와 개인 작업 중심 UX를 완성한다.
  dependencies:
  - WP-PRJ-002
  - WP-PRJ-003
  - WP-PRJ-004
  - WP-CAL-001
  - WP-DMS-002
  - WP-APR-001
  owned_modules:
  - frontend-project
  outputs:
  - project dashboard
  - my work
  - timeline
  acceptance_criteria:
  - 경고에서 원본으로 드릴다운한다
  - PM과 직원 역할별로 필요한 정보가 보인다
  - 부분 실패가 전체 화면을 막지 않는다
  risk: medium
  required_reviews:
  - domain_owner
  - qa
- id: WP-QA-P1
  phase: 1
  stream: qa
  title: Phase 1 프로젝트 파일럿 게이트
  goal: 신규 프로젝트 파일럿의 핵심 여정을 검증한다.
  dependencies:
  - WP-UI-PRJ-001
  owned_modules:
  - qa
  outputs:
  - project E2E
  - external collaborator tests
  - pilot checklist
  acceptance_criteria:
  - 템플릿→업무→회의→산출물→결재 흐름이 통과한다
  - 외부 사용자의 범위 격리가 확인된다
  - 파일럿 사용자 승인 기록이 있다
  risk: critical
  required_reviews:
  - architecture
  - qa_security
- id: WP-CRM-001
  phase: 2
  stream: commercial
  title: 고객사·담당자
  goal: 고객 조직과 담당자, 중복 후보를 관리한다.
  dependencies:
  - WP-QA-000
  owned_modules:
  - crm
  outputs:
  - account/contact APIs
  - duplicate detection
  - CRM screens
  acceptance_criteria:
  - 사업자번호/도메인 중복 경고가 동작한다
  - 고객 접근 권한과 민감 메모가 분리된다
  - 프로젝트/계약 링크가 제공된다
  risk: high
  required_reviews:
  - architecture
  - qa_security
- id: WP-CRM-002
  phase: 2
  stream: commercial
  title: 리드·영업활동
  goal: 리드 전환과 전화/메일/미팅/후속 활동을 관리한다.
  dependencies:
  - WP-CRM-001
  - WP-CAL-001
  owned_modules:
  - crm
  outputs:
  - lead conversion
  - activity timeline
  - follow-up alerts
  acceptance_criteria:
  - 전환 결과가 고객/담당자/기회와 연결된다
  - 중복 전환을 방지한다
  - 후속 활동이 일정/알림과 연결된다
  risk: medium
  required_reviews:
  - domain_owner
  - qa
- id: WP-SAL-001
  phase: 2
  stream: commercial
  title: 영업기회·파이프라인
  goal: 영업 단계, 금액, 확률, 수주/실주를 관리한다.
  dependencies:
  - WP-CRM-001
  owned_modules:
  - sales
  outputs:
  - opportunity APIs
  - pipeline board
  - forecast metrics
  acceptance_criteria:
  - 단계 변경 이력이 남는다
  - 수주 조건을 검증한다
  - 가중 파이프라인 근거를 추적한다
  risk: high
  required_reviews:
  - architecture
  - qa_security
- id: WP-SAL-002
  phase: 2
  stream: commercial
  title: 품목 카탈로그·견적 버전
  goal: 견적 계산, 버전, 결재, PDF 계약을 구현한다.
  dependencies:
  - WP-SAL-001
  - WP-APR-001
  - WP-DMS-001
  owned_modules:
  - sales
  outputs:
  - catalog
  - quote APIs
  - PDF template
  acceptance_criteria:
  - 공급가/세액/합계 계산이 정확하다
  - 발송 견적은 새 버전으로만 수정한다
  - 원가/마진 권한이 분리된다
  risk: critical
  required_reviews:
  - architecture
  - qa_security
- id: WP-CON-001
  phase: 2
  stream: commercial
  title: 계약·버전·보안등급
  goal: 계약 상태, 서명본, 변경계약, 접근 통제를 구현한다.
  dependencies:
  - WP-CRM-001
  - WP-SAL-002
  - WP-APR-001
  - WP-DMS-001
  owned_modules:
  - contract
  outputs:
  - contract APIs
  - version compare
  - contract permissions
  acceptance_criteria:
  - ACTIVE 조건이 검증된다
  - 계약 변경 이력이 보존된다
  - 민감 문서 접근과 다운로드가 감사된다
  risk: critical
  required_reviews:
  - architecture
  - qa_security
- id: WP-CON-002
  phase: 2
  stream: commercial
  title: 계약 의무·지급 일정·갱신
  goal: 산출물/검수 의무와 지급/갱신 계획을 관리한다.
  dependencies:
  - WP-CON-001
  - WP-DMS-002
  owned_modules:
  - contract
  outputs:
  - obligation APIs
  - payment schedules
  - renewal alerts
  acceptance_criteria:
