project: Luminode 프로젝트 지식·문서 자동화
track: pkd
decision: ADR-016
note: >
  2차 화면 목업이 정의하는 제품의 작업 패키지다. docs/specs의 99화면 ERP 설계와
  work_packages.yaml의 71개 패키지는 병행 유지하며 이 파일과 섞지 않는다.
baseline:
  users_now: <=10
  users_max: <=30
  deployment: self-hosted
  locale: ko-KR
  timezone: Asia/Seoul
  architecture: modular-monolith-with-adapters
  design_source: UI mockups/exports/
workflow_states:
- proposed
- ready
- in_progress
- review
- blocked
- done
shared_with_erp_track:
- WP-PLT-001
- WP-PLT-002
- WP-OPS-001
priority_rule: >
  단계 A~G 순서를 따른다. 같은 단계 안에서 선행이 충족된 패키지는 병렬 진행할 수 있다.
packages:
- id: WP-PKD-001
  stage: B
  stream: ux
  title: 디자인 토큰·패키지 배선
  goal: 목업의 디자인 시스템을 Tailwind 토큰으로 옮기고 packages/ui를 실제 컴포넌트 라이브러리로 만든다.
  dependencies:
  - WP-PLT-001
  owned_modules:
  - frontend-core
  outputs:
  - tailwind tokens
  - ui package wiring
  - self-hosted fonts
  acceptance_criteria:
  - 목업 토큰 값이 그대로 이식된다
  - ADR-019의 명암비 보정이 적용된다
  - apps/web이 @lep/ui를 워크스페이스 의존성으로 소비한다
  - pnpm lint·typecheck·build가 통과한다
  risk: medium
  required_reviews:
  - domain_owner
  - qa
- id: WP-PKD-002
  stage: B
  stream: ux
  title: 공유 컴포넌트·앱 셸·화면 상태
  goal: 목업 컴포넌트 클래스를 React 컴포넌트로 만들고 앱 셸과 일곱 화면 상태를 제공한다.
  dependencies:
  - WP-PKD-001
  owned_modules:
  - frontend-core
  outputs:
  - shared components
  - app shell
  - screen states
  - dev gallery
  acceptance_criteria:
  - 색상만으로 상태를 구분하는 배지를 타입 수준에서 만들 수 없다
  - loading/empty/error/forbidden/stale/offline/partial 패턴이 제공된다
  - 잠긴 메뉴가 탭 순서에 없고 사유가 보인다
  - 키보드만으로 셸의 주요 기능에 도달한다
  risk: medium
  required_reviews:
  - domain_owner
  - qa
- id: WP-PKD-003
  stage: C
  stream: platform
  title: 백엔드 모듈 골격·공통 API 계약
  goal: 도메인 모듈 여섯 개와 공통 응답 봉투·오류·페이지네이션·포트를 만든다.
  dependencies:
  - WP-PLT-001
  owned_modules:
  - projects
  - delivery
  - knowledge
  - documents
  - mail
  - integrations
  outputs:
  - module skeletons
  - response envelope
  - problem details
  - integration ports
  acceptance_criteria:
  - 경계 검사기가 통과한다
  - 응답이 05_API_AND_EVENT_CONTRACTS의 봉투 형식을 따른다
  - 오류가 RFC 7807 형식이고 trace_id를 포함한다
  - 포트 다섯 개가 도메인 계층에 정의되고 픽스처 어댑터가 동작한다
  risk: high
  required_reviews:
  - architecture
  - qa_security
- id: WP-PKD-004
  stage: D
  stream: product
  title: 화면 01 통합 홈
  goal: 프로젝트 선택, 발주사/용역사 전환, 상태 요약, AI 요약을 구현한다.
  dependencies: [WP-PKD-002, WP-PKD-003]
  screens: ['01']
  acceptance_criteria:
  - 프로젝트 카드가 진행률·볼트·메일·정합 상태를 보여준다
  - 카드 하나가 실패해도 나머지가 남는다
  - 역할 전환이 URL에 반영된다
  risk: medium
  required_reviews: [domain_owner, qa]
- id: WP-PKD-005
  stage: D
  stream: product
  title: 화면 03 WBS·일정 보드
  goal: Gantt와 Excel 보기 전환, xlsx 내보내기, 깃허브 정합 어긋남 표시를 구현한다.
  dependencies: [WP-PKD-004]
  screens: ['03']
  acceptance_criteria:
  - 점선 막대가 WBS 외 커밋을, 회색이 PR 미병합을 뜻한다
  - 태스크 상태가 ADR-016의 pkd 값을 쓴다
  - 라이브러리 없이 CSS 그리드로 그린다
  risk: high
  required_reviews: [domain_owner, qa]
- id: WP-PKD-006
  stage: D
  stream: product
  title: 화면 02 과업지시서 업로드·태스크 분류
  goal: 업로드, AI 조항 분류, 신뢰도 표시, WBS 매핑을 구현한다.
  dependencies: [WP-PKD-005]
  screens: ['02']
  acceptance_criteria:
  - 신뢰도 낮은 조항이 검토 필요로 표시된다
  - 사람 확인 없이 WBS에 반영되지 않는다
  - AI 분류값이 사람 입력과 시각적으로 구분된다
  risk: medium
  required_reviews: [domain_owner, qa]
- id: WP-PKD-007
  stage: D
  stream: product
  title: 화면 07 깃허브 연동 상태
  goal: 정합률, 불일치 목록, 태스크와 이슈·PR 매핑을 구현한다.
  dependencies: [WP-PKD-005]
  screens: ['07']
  acceptance_criteria:
  - 불일치 두 유형이 구분된다
  - 불일치에서 해소 행동으로 이동한다
  risk: medium
  required_reviews: [domain_owner, qa]
- id: WP-PKD-008
  stage: D
  stream: product
  title: 화면 04 지식 볼트
  goal: 옵시디언 동기화 상태, 태스크별 링크 노트, 노트 미리보기와 백링크를 구현한다.
  dependencies: [WP-PKD-004]
  screens: ['04']
  acceptance_criteria:
  - 위키링크와 백링크가 원본으로 이동한다
  - 자동 생성 노트의 출처가 표시된다
  risk: medium
  required_reviews: [domain_owner, qa]
- id: WP-PKD-009
  stage: D
  stream: product
  title: 화면 08 회의록·변경관리
  goal: AI 추출 결정과 액션아이템, 변경 반영 미리보기, 볼트·WBS 반영을 구현한다.
  dependencies: [WP-PKD-005, WP-PKD-008]
  screens: ['08']
  acceptance_criteria:
  - 반영 전 영향 범위 미리보기가 보인다
  - 미리보기와 실행이 같은 계산을 쓴다
  - 확정된 액션아이템만 업무가 된다
  risk: high
  required_reviews: [domain_owner, qa]
- id: WP-PKD-010
  stage: D
  stream: product
  title: 화면 06 메일함
  goal: 하이웍스 연동 상태, 프로젝트 자동 분류, 지식화와 일정 반영을 구현한다.
  dependencies: [WP-PKD-004]
  screens: ['06']
  acceptance_criteria:
  - 분류 신뢰도가 표시된다
  - 미분류와 프로젝트 무관이 구분된다
  risk: medium
  required_reviews: [domain_owner, qa]
- id: WP-PKD-011
  stage: D
  stream: product
  title: 화면 05 문서 생성·변환
  goal: md에서 hwpx까지 5단계 파이프라인과 미리보기를 구현한다.
  dependencies: [WP-PKD-004]
  screens: ['05']
  acceptance_criteria:
  - 다섯 단계가 순서대로 표시된다
  - 변환 실패에 재시도가 있다
  risk: medium
  required_reviews: [domain_owner, qa]
- id: WP-PKD-012
  stage: D
  stream: product
  title: 화면 09 AI·로컬 LLM 설정
  goal: 공통 GPU 서버 상태, 프로젝트별 모델 설정, 연동 자격증명 상태를 구현한다.
  dependencies: [WP-PKD-004]
  screens: ['09']
  acceptance_criteria:
  - 프로젝트 간 모델 격리가 명시된다
  - 외부 API로 전송되지 않는다는 원칙이 화면에 있다
  - 이번 단계에서 실제 비밀을 입력받지 않는다
  risk: high
  required_reviews: [architecture, qa_security]
- id: WP-PKD-013
  stage: D
  stream: product
  title: 화면 10 프로젝트 드라이브
  goal: 원본·보고·산출·소스코드 4분류와 출처 표시, 읽기 전용 규칙을 구현한다.
  dependencies: [WP-PKD-004]
  screens: ['10']
  acceptance_criteria:
  - 원본문서가 읽기 전용이다
  - 자동 수집 파일의 출처가 표시된다
  risk: medium
  required_reviews: [domain_owner, qa]
- id: WP-PKD-020
  stage: E
  stream: infra
  title: 영속성 기반
  goal: Compose와 PostgreSQL 위에 모듈별 저장소 어댑터와 마이그레이션을 만든다.
  dependencies: [WP-PKD-013, WP-OPS-001]
  outputs: [compose manifests, alembic migrations, sql repositories]
  acceptance_criteria:
  - 재시작해도 데이터가 남는다
  - 도메인 계층이 바뀌지 않는다
  - 픽스처 어댑터가 테스트에서 계속 동작한다
  risk: high
  required_reviews: [architecture, qa_security]
- id: WP-PKD-021
  stage: F
  stream: platform
  title: 인증·세션 연결
  goal: WP-PLT-002의 인증을 이 트랙의 앱 셸과 자격증명 화면에 연결한다.
  dependencies: [WP-PKD-020, WP-PLT-002]
  acceptance_criteria:
  - 앱 셸이 실제 세션을 표시한다
  - ForbiddenState가 실제 화면에 연결된다
  - 역할 전환이 권한 경계인지 보기 설정인지 확정된다
  risk: critical
  required_reviews: [architecture, qa_security]
- id: WP-PKD-030
  stage: G
  stream: integration
  title: kordoc 문서 변환 어댑터
  goal: DocumentConverterPort의 실제 구현을 붙인다.
  status: done
  dependencies: []
  note: >
    인증(WP-PKD-021)을 기다리지 않고 먼저 붙였다. 변환기는 비밀을 다루지 않고
    로컬 프로세스만 실행하므로 접근 통제 전제가 필요 없다.
  upstream: https://github.com/chrisryugj/kordoc
  configured_with:
  - LEP_ADAPTER_CONVERTER=kordoc
  - LEP_KORDOC_CLI 또는 LEP_KORDOC_USE_NPX=1
  acceptance_criteria:
  - 마크다운에서 실제 hwpx가 생성된다
  - 변환 실패가 실패로 보고되고 재시도가 동작한다
  - 화면 09가 실제 변환기 버전을 표시한다
  risk: medium
  required_reviews: [domain_owner, qa]
- id: WP-PKD-031
  stage: G
  stream: integration
  title: 깃허브 어댑터
  goal: VcsPort의 실제 구현과 WBS 정합 계산을 붙인다.
  status: done
  dependencies: []
  note: >
    토큰이 환경 변수로만 들어오고 저장소에 남지 않으므로 인증 전에 붙일 수 있다.
    자격증명을 화면에서 입력받는 것은 여전히 WP-PKD-021 이후다.
  connected_repository: SunhSOO/ERP
  configured_with:
  - LEP_ADAPTER_VCS=github
  - LEP_GITHUB_TOKEN
  - LEP_GITHUB_REPO 또는 LEP_GITHUB_REPOS
  acceptance_criteria:
  - 실제 저장소의 PR·이슈·브랜치를 읽는다
  - 태스크 코드로 WBS와 대조해 불일치 두 유형을 구분한다
  - 연결된 작업이 없으면 정상이 아니라 지연으로 표시한다
  risk: medium
  required_reviews: [architecture, qa_security]
- id: WP-PKD-032
  stage: G
  stream: integration
  title: 옵시디언 볼트 어댑터
  goal: VaultPort의 실제 구현과 위키링크·백링크 색인을 붙인다.
  status: done
  dependencies: []
  note: >
    볼트는 로컬 파일이라 비밀이 없다. 편집은 옵시디언에서 한다는 목업의 가정을
    유지하고 여기서는 읽기와 노트 생성만 한다.
  connected_vault: C:/Users/sunhy/Desktop/행수지식
  configured_with:
  - LEP_ADAPTER_VAULT=obsidian
  - LEP_OBSIDIAN_VAULT
  - LEP_OBSIDIAN_PROJECT_DIRS (선택)
  acceptance_criteria:
  - 실제 마크다운 파일을 읽고 노트 수를 보고한다
  - 위키링크에서 백링크 색인을 만든다
  - 노트를 만들 때 기존 파일을 덮지 않는다
  risk: medium
  required_reviews: [domain_owner, qa]
- id: WP-PKD-033
  stage: G
  stream: integration
  title: 로컬 LLM 어댑터
  goal: LlmPort를 OpenAI 호환 규격으로 구현하고 조항 분류·회의록 추출에 연결한다.
  dependencies: [WP-PKD-021]
  blocked_on_input: 사내 GPU 추론 서버 주소와 사양
  acceptance_criteria:
  - 신뢰도와 근거 위치를 함께 반환한다
  - 낮은 신뢰도가 사람 검토로 이어진다
  risk: high
  required_reviews: [architecture, qa_security]
- id: WP-PKD-034
  stage: G
  stream: integration
  title: 하이웍스 메일 어댑터
  goal: MailPort의 실제 구현을 붙인다. API가 막히면 IMAP 대체 경로를 쓴다.
  dependencies: [WP-PKD-021]
  blocked_on_input: 하이웍스 계정과 API 접근 권한
  risk: high
  required_reviews: [architecture, qa_security]
